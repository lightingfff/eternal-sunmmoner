name: APK fresh-install smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'tools/package_apk.py'
      - 'tools/verify_apk_update.py'
      - 'tools/check_apk_installability.py'
      - 'tools/test_check_apk_installability.py'
      - '.github/workflows/apk-install-smoke.yml'
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Completed main.yml build run for this exact branch HEAD
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: apk-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Fresh install API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test probe failure handling
        run: python3 -m unittest discover -s tools -p test_check_apk_installability.py -v
      - name: Download the exact APK from its existing build workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_RUN: ${{ inputs.build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          build_run="$REQUESTED_RUN"
          if [ -z "$build_run" ]; then
            for attempt in $(seq 1 60); do
              build_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?head_sha=$SOURCE_SHA&per_page=20" \
                --jq '.workflow_runs | sort_by(.id) | last | .id // empty')
              if [ -n "$build_run" ]; then
                state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run" --jq .status)
                if [ "$state" = completed ]; then break; fi
              fi
              sleep 15
            done
          fi
          case "$build_run" in ''|*[!0-9]*) echo 'No valid APK build run was found'; exit 1;; esac
          expected_workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml" --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run" > "$RUNNER_TEMP/apk-producer.json"
          jq -e --arg sha "$SOURCE_SHA" --argjson workflow "$expected_workflow" \
            '.head_sha == $sha and .workflow_id == $workflow and .status == "completed" and .conclusion == "success"' \
            "$RUNNER_TEMP/apk-producer.json"
          gh run download "$build_run" --repo "$GITHUB_REPOSITORY" --name Eternal-Summoner-APK --dir "$RUNNER_TEMP/apk-under-test"
          python3 tools/package_apk.py --verify "$RUNNER_TEMP/apk-under-test"
          cp "$RUNNER_TEMP/apk-producer.json" "$RUNNER_TEMP/apk-under-test/producer.json"
      - name: Enable emulator hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Install without test-only bypass on a fresh Android emulator
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: aosp_atd
          arch: x86_64
          ram-size: 2048M
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/check_apk_installability.py --apk "$RUNNER_TEMP/apk-under-test/Eternal-Summoner-debug.apk" --serial emulator-5554 --sdk-root "$ANDROID_HOME" --output "app/build/apk-install-api${{ matrix.api }}"
      - name: Retain installation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apk-install-api${{ matrix.api }}
          path: |
            app/build/apk-install-api${{ matrix.api }}/
            ${{ runner.temp }}/apk-under-test/producer.json
          if-no-files-found: warn
          retention-days: 7
