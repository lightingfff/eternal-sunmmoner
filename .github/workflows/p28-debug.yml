name: P28 debug compile log (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile tests + run P28 tests (log to file, never fail the job)
        run: |
          gradle :app:compileDebugUnitTestKotlin > /tmp/build.log 2>&1 || true
          gradle :app:testDebugUnitTest \
            --tests 'com.example.ui.P28UiEvidenceTest' \
            --tests 'com.example.ui.P28ComponentsTest' >> /tmp/build.log 2>&1 || true
      - name: Post errors as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "P28-C debug — errors on $(git rev-parse --short HEAD):"
            echo '```'
            grep -E '^e: |error: |FAILED|What went wrong' /tmp/build.log | head -40 || echo "(no errors found)"
            echo '--- test result xml failures ---'
            for f in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
              python3 - "$f" <<'PYEOF'
import sys, xml.etree.ElementTree as ET
try:
    root = ET.parse(sys.argv[1]).getroot()
    for case in root.iter('testcase'):
        fail = case.find('failure') or case.find('error')
        if fail is not None:
            print(f"{sys.argv[1].split('TEST-')[1]}: {case.get('name')}: {(fail.get('message') or (fail.text or ''))[:600]}")
except Exception as e:
    pass
PYEOF
            done || true
            echo '--- tail ---'
            grep -E 'BUILD|PASSED|FAILED' /tmp/build.log | tail -15
            echo '```'
          } > /tmp/comment.md
          gh pr comment 37 --repo lightingfff/eternal-sunmmoner --body-file /tmp/comment.md || echo "comment failed"
