name: P28 debug compile log (temporary)

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  debug:
    name: Post compile errors as PR comment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Add temporary Google Sign-In resource
        run: |
          mkdir -p app/src/debug/res/values
          printf '<resources><string name="default_web_client_id" translatable="false">debug-placeholder.apps.googleusercontent.com</string></resources>\n' > app/src/debug/res/values/google_services_placeholder.xml

      - name: Compile (log to file, never fail the job)
        run: gradle :app:assembleDebug > /tmp/build.log 2>&1 || true

      - name: Post Kotlin errors as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "P28 debug — compile errors on ${{ github.sha }}:"
            echo '```'
            grep -E '^e: |error: ' /tmp/build.log | head -60 || echo "(no 'e:'/'error:' lines found — see tail below)"
            echo '--- tail of build log ---'
            tail -30 /tmp/build.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md || echo "comment failed"
