name: P28 debug compile log (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  debug:
    name: Post compile errors as PR comment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Add temporary Google Sign-In resource
        run: |
          mkdir -p app/src/debug/res/values
          printf '<resources><string name="default_web_client_id" translatable="false">debug-placeholder.apps.googleusercontent.com</string></resources>\n' > app/src/debug/res/values/google_services_placeholder.xml

      - name: Compile main + tests (log to file, never fail the job)
        run: |
          gradle :app:compileDebugKotlin :app:compileDebugUnitTestKotlin > /tmp/build.log 2>&1 || true
          gradle :app:testDebugUnitTest \
            --tests 'com.example.P28ComponentsTest' \
            --tests 'com.example.ui.P27BUiTest' \
            --tests 'com.example.ui.SanctuaryHudContrastTest' \
            --tests 'com.example.ui.SanctuaryUiTokenTest' \
            --tests 'com.example.ui.LayoutResponsivenessRobolectricTest' \
            --tests 'com.example.P27BNightResponseTest' >> /tmp/build.log 2>&1 || true

      - name: Post Kotlin errors as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "P28 debug — errors on $(git rev-parse --short HEAD):"
            echo '```'
            grep -E '^e: |error: ' /tmp/build.log | head -60 || echo "(no compile errors)"
            echo '--- failed tests ---'
            grep -E 'FAILED|failed,' /tmp/build.log | head -30 || true
            echo '--- tail of build log ---'
            grep -E 'BUILD|Task :app:(compile|test)' /tmp/build.log | tail -10
            tail -20 /tmp/build.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 36 --repo lightingfff/eternal-sunmmoner --body-file /tmp/comment.md || echo "comment failed"
