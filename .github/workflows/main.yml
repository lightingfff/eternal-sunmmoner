name: Build Eternal Summoner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          # yes exits with SIGPIPE after sdkmanager closes stdin; preserve sdkmanager's status.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore cached debug keystore (preserve install signature)
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Generate debug keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "Reusing cached debug.keystore — preserves signature for app updates (avoids 'App not installed / corrupted' on reinstall)"
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | head -n 5 || true
          else
            echo "No cached keystore — generating new debug.keystore"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore
          sha256sum debug.keystore | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate assets (PNG CRC, manifest SHA, package consistency)
        run: python3 tools/validate_assets.py

      - name: Add temporary Google Sign-In resource
        run: |
          mkdir -p app/src/debug/res/values
          cat > app/src/debug/res/values/google_services_placeholder.xml <<'EOF'
          <resources>
              <string name="default_web_client_id" translatable="false">debug-placeholder.apps.googleusercontent.com</string>
          </resources>
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Verify signed APK and package Android-compatible ZIP
        run: |
          set -euo pipefail
          echo "== apksigner verify (distributed APK) =="
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          echo "== file type check (must be ZIP archive, not HTML) =="
          file app/build/outputs/apk/debug/app-debug.apk | tee -a "$GITHUB_STEP_SUMMARY"
          if head -c 200 app/build/outputs/apk/debug/app-debug.apk | grep -qi "<html"; then echo "FAIL: APK is HTML error page"; exit 1; fi
          echo "== unzip -t APK (zip integrity) =="
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          echo "== package portable ZIP (STORE, no recompression) for artifact ==="
          python3 tools/package_apk.py --apk app/build/outputs/apk/debug/app-debug.apk --output app/build/apk-distribution | tee "$RUNNER_TEMP/apk-report.json"
          echo "== APK report (BYTES + SHA-256) =="
          cat "$RUNNER_TEMP/apk-report.json"
          echo "--- APK report ---" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/apk-report.json" >> "$GITHUB_STEP_SUMMARY"
          echo "== exact bytes and SHA-256 (record for user) =="
          stat -c '%n %s bytes' app/build/apk-distribution/Eternal-Summoner-debug.apk | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum app/build/apk-distribution/Eternal-Summoner-debug.apk | tee -a "$GITHUB_STEP_SUMMARY"
          stat -c '%n %s bytes' app/build/apk-distribution/Eternal-Summoner-Android.zip | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum app/build/apk-distribution/Eternal-Summoner-Android.zip | tee -a "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/apk-distribution/ | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== aapt badging (package ID, version, SDK, ABIs) =="
          "$ANDROID_HOME/build-tools/36.0.0/aapt dump badging app/build/apk-distribution/Eternal-Summoner-debug.apk | head -n 30" || "$ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging app/build/apk-distribution/Eternal-Summoner-debug.apk | head -n 30" || true
          echo "== manifest check =="
          ls "$ANDROID_HOME/cmdline-tools"/*/bin/apkanalyzer 2>/dev/null | head -1 | xargs -I{} sh -c '{} manifest print app/build/apk-distribution/Eternal-Summoner-debug.apk 2>&1 | head -n 30' || true

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Eternal-Summoner-APK
          path: |
            app/build/apk-distribution/Eternal-Summoner-debug.apk
            app/build/apk-distribution/Eternal-Summoner-Android.zip
            app/build/apk-distribution/SHA256SUMS
          compression-level: 0
          if-no-files-found: error

      - name: Download and verify the actual uploaded artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Eternal-Summoner-APK.zip"
          extracted="$RUNNER_TEMP/verified-apk-artifact"
          echo "Downloading artifact $ARTIFACT_ID via GH API (exact bytes)..."
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$archive"
          echo "== outer artifact ZIP test (must be ZIP, not HTML) =="
          file "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
          if head -c 500 "$archive" | grep -qi "<html"; then echo "FAIL: artifact is HTML error page (incomplete upload/auth)"; cat "$archive" | head -c 2000; exit 1; fi
          unzip -t "$archive"
          stat -c '%n %s bytes' "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p "$extracted"
          unzip -q "$archive" -d "$extracted"
          ls -lh "$extracted" | tee -a "$GITHUB_STEP_SUMMARY"
          stat -c '%n %s bytes' "$extracted/Eternal-Summoner-debug.apk" | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum "$extracted/Eternal-Summoner-debug.apk" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== verify inner APK SHA matches build (detect truncated download) =="
          grep "Eternal-Summoner-debug.apk" "$extracted/SHA256SUMS" | tee -a "$GITHUB_STEP_SUMMARY"
          (cd "$extracted" && sha256sum -c SHA256SUMS --ignore-missing) || (echo "FAIL: SHA-256 mismatch — truncated download, duplicate '(1)' file, or HTML saved as APK"; exit 1)
          echo "== apksigner verify extracted APK =="
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$extracted/Eternal-Summoner-debug.apk"
          unzip -t "$extracted/Eternal-Summoner-debug.apk"
          unzip -t "$extracted/Eternal-Summoner-Android.zip"
          echo '✅ Uploaded artifact downloaded successfully; outer ZIP CRC, APK contents, signature and SHA-256 all verified.' | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish direct APK to Release (bypass artifact ZIP)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact for Release
        uses: actions/download-artifact@v4
        with:
          name: Eternal-Summoner-APK
          path: dist

      - name: List artifacts
        run: |
          ls -lh dist/
          stat -c '%n %s bytes' dist/* | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum dist/* | tee SHA256SUMS.txt
          cat SHA256SUMS.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release with direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          name: Eternal Summoner APK #${{ github.run_number }}
          body: |
            Direct APK download — no nested ZIP extraction needed.
            - `Eternal-Summoner-debug.apk` — installable APK (signed debug, 33-34 MB). Download this file directly and install.
            - `Eternal-Summoner-Android.zip` — portable ZIP (STORE) containing APK + SHA256 for extraction test.
            - `SHA256SUMS` — SHA-256 for both files. Verify: `sha256sum -c SHA256SUMS`

            **Install:** Download `Eternal-Summoner-debug.apk` (not the Actions artifact ZIP) from this Release. If you downloaded from Actions, you must EXTRACT the ZIP first — do not rename .zip to .apk.
            Built from `${{ github.sha }}` — workflow `${{ github.run_id }}`.
          files: |
            dist/Eternal-Summoner-debug.apk
            dist/Eternal-Summoner-Android.zip
            dist/SHA256SUMS
            SHA256SUMS.txt
          generate_release_notes: false
