name: Build Eternal Summoner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  # The P27B/Lyra bots push their own evidence commits, so without this every push to a PR
  # kicked off a second full APK build of identical content. Cancel superseded PR builds;
  # never cancel a main build that may be publishing a Release.
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          # yes exits with SIGPIPE after sdkmanager closes stdin; preserve sdkmanager's status.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore cached debug keystore (preserve install signature)
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Generate debug keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "Reusing cached debug.keystore — preserves signature for app updates (avoids 'App not installed / corrupted' on reinstall)"
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | head -n 5 || true
          else
            echo "No cached keystore — generating new debug.keystore"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore
          sha256sum debug.keystore | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate assets (PNG CRC, manifest SHA, package consistency)
        run: python3 tools/validate_assets.py

      - name: Add temporary Google Sign-In resource
        run: |
          mkdir -p app/src/debug/res/values
          cat > app/src/debug/res/values/google_services_placeholder.xml <<'EOF'
          <resources>
              <string name="default_web_client_id" translatable="false">debug-placeholder.apps.googleusercontent.com</string>
          </resources>
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Verify signed APK and package Android-compatible ZIP
        run: |
          set -euo pipefail
          echo "== apksigner verify (distributed APK) =="
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          echo "== file type check (must be ZIP archive, not HTML) =="
          file app/build/outputs/apk/debug/app-debug.apk | tee -a "$GITHUB_STEP_SUMMARY"
          if head -c 200 app/build/outputs/apk/debug/app-debug.apk | grep -qi "<html"; then echo "FAIL: APK is HTML error page"; exit 1; fi
          echo "== unzip -t APK (zip integrity) =="
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          echo "== package portable ZIP (STORE, no recompression) for artifact ==="
          python3 tools/package_apk.py --apk app/build/outputs/apk/debug/app-debug.apk --output app/build/apk-distribution | tee "$RUNNER_TEMP/apk-report.json"
          echo "== APK report (BYTES + SHA-256) =="
          cat "$RUNNER_TEMP/apk-report.json"
          echo "--- APK report ---" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/apk-report.json" >> "$GITHUB_STEP_SUMMARY"
          echo "== exact bytes and SHA-256 (record for user) =="
          stat -c '%n %s bytes' app/build/apk-distribution/Eternal-Summoner-debug.apk | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum app/build/apk-distribution/Eternal-Summoner-debug.apk | tee -a "$GITHUB_STEP_SUMMARY"
          stat -c '%n %s bytes' app/build/apk-distribution/Eternal-Summoner-Android.zip | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum app/build/apk-distribution/Eternal-Summoner-Android.zip | tee -a "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/apk-distribution/ | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== aapt badging (package ID, version, SDK, ABIs) =="
          "$ANDROID_HOME/build-tools/36.0.0/aapt dump badging app/build/apk-distribution/Eternal-Summoner-debug.apk | head -n 30" || "$ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging app/build/apk-distribution/Eternal-Summoner-debug.apk | head -n 30" || true
          echo "== manifest check =="
          ls "$ANDROID_HOME/cmdline-tools"/*/bin/apkanalyzer 2>/dev/null | head -1 | xargs -I{} sh -c '{} manifest print app/build/apk-distribution/Eternal-Summoner-debug.apk 2>&1 | head -n 30' || true

      # OPTIONAL copy for people who browse Actions. The APK that users install is
      # published to a GitHub Release further down, from THIS runner, before it exits.
      # Rationale: a full artifact store does not mean the APK is bad. Before this,
      # "Failed to CreateArtifact: Artifact storage quota has been hit" failed the whole
      # build job, which in turn SKIPPED the release job - so a perfectly good APK could
      # not be downloaded at all. Quota trouble is now an explicit WARN, never a build
      # failure, and never a silent pass either (it is written to the job summary).
      - name: Upload APK as an optional Actions artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Eternal-Summoner-APK
          path: |
            app/build/apk-distribution/Eternal-Summoner-debug.apk
            app/build/apk-distribution/Eternal-Summoner-Android.zip
            app/build/apk-distribution/SHA256SUMS
          compression-level: 0
          if-no-files-found: warn
          retention-days: 3

      - name: Record artifact upload outcome (quota is a WARN, not a build failure)
        if: always()
        run: |
          if [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "ARTIFACT UPLOAD: OK" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "ARTIFACT UPLOAD BLOCKED BY QUOTA (not a build error; the Release below is the download path)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the uploaded artifact ZIP (skipped when the quota blocked it)
        # This step used to fail the build whenever the artifact store refused the upload.
        # It cannot: the Release above is the delivery path. When the upload did succeed,
        # this still proves the artifact is real bytes and not an HTML error page.
        if: steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Eternal-Summoner-APK.zip"
          extracted="$RUNNER_TEMP/verified-apk-artifact"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$archive"
          if head -c 500 "$archive" | grep -qi "<html"; then echo "FAIL: artifact is an HTML error page"; exit 1; fi
          file "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -t "$archive"
          mkdir -p "$extracted"
          unzip -q "$archive" -d "$extracted"
          (cd "$extracted" && sha256sum -c SHA256SUMS --ignore-missing)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$extracted/Eternal-Summoner-debug.apk"
          echo 'Artifact ZIP, CRC, inner APK signature and SHA-256 all verified.' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Skip note when the artifact store was unavailable
        if: steps.upload.outcome != 'success'
        run: |
          echo "Artifact ZIP verification SKIPPED: upload blocked by quota." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "The APK itself is published in the Release step below." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish APK direct to GitHub Release (no artifact store involved)
        # push-to-main only. PRs never publish a release; a fork PR has no write token,
        # which is why the event guard comes first.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          name: "Eternal Summoner APK ${{ github.run_number }}"
          body: |
            Direct APK download - no nested artifact ZIP needed.
            - `Eternal-Summoner-debug.apk` - installable APK (signed debug). Download this file and install.
            - `Eternal-Summoner-Android.zip` - portable ZIP (STORE) with APK + SHA256.
            - `SHA256SUMS` - verify with `sha256sum -c SHA256SUMS`.
            Published from the build runner itself, so a full Actions artifact store cannot block it.
            Built from `${{ github.sha }}` - workflow `${{ github.run_id }}`.
          files: |
            app/build/apk-distribution/Eternal-Summoner-debug.apk
            app/build/apk-distribution/Eternal-Summoner-Android.zip
            app/build/apk-distribution/SHA256SUMS
          generate_release_notes: false

  # There is deliberately no second "release" job any more.
  # The old one did needs:[build] + download-artifact, so a full artifact store skipped
  # the release completely. The APK is now published inside the build job above, from the
  # same workspace that built and verified it, and only for push-to-main.
