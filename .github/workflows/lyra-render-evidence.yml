name: Lyra engine render evidence

# Additive workflow: it does not modify or replace "Build Eternal Summoner APK".
# It runs the Robolectric native-graphics render test, which executes the real draw code
# (Sanctuary world + depth sorting + canopy pass + drawCharacterSprite) and uploads the
# resulting PNGs, so a reviewer can look at renderer output instead of a mockup.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/**'
      - 'app/src/test/java/com/example/LyraEngineRenderTest.kt'
      - 'app/src/test/java/com/example/MapForgeGroundRenderTest.kt'
      - 'app/src/test/java/com/example/MapForgeTerrainRenderTest.kt'
      - 'app/src/test/java/com/example/MapForgeArchitectureRenderTest.kt'
      - 'app/src/test/java/com/example/MapForgeArchitectureContractTest.kt'
      - 'app/src/test/java/com/example/MapForgeP21RenderTest.kt'
      - 'app/src/test/java/com/example/MapForgeP21ContractTest.kt'
      - 'app/src/test/java/com/example/MapForgeP22RenderTest.kt'
      - 'app/src/test/java/com/example/MapForgeP22ContractTest.kt'
      - 'app/src/test/java/com/example/MapForgeP23RenderTest.kt'
      - 'app/src/test/java/com/example/MapForgeP23ContractTest.kt'
      - 'app/src/test/java/com/example/HdrLightingRenderTest.kt'
      - '.github/workflows/lyra-render-evidence.yml'

permissions:
  contents: write

jobs:
  render:
    name: Render Lyra with the game renderer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Add temporary Google Sign-In resource
        run: |
          mkdir -p app/src/debug/res/values
          cat > app/src/debug/res/values/google_services_placeholder.xml <<'EOF'
          <resources>
              <string name="default_web_client_id" translatable="false">debug-placeholder.apps.googleusercontent.com</string>
          </resources>
          EOF

      - name: Render Lyra (real draw code, Robolectric native graphics)
        run: gradle :app:testDebugUnitTest --tests "com.example.LyraEngineRenderTest" --stacktrace

      # P18: the Map Forge ground slice, same harness, same real draw path.
      - name: Render ground slice (real draw code, Robolectric native graphics)
        run: gradle :app:testDebugUnitTest --tests "com.example.MapForgeGroundRenderTest" --stacktrace

      # P20: armory architecture + cypress vegetation slice, fixed cameras incl. actor.
      - name: Render architecture slice (real draw code, Robolectric native graphics)
        run: gradle :app:testDebugUnitTest --tests "com.example.MapForgeArchitectureRenderTest" --stacktrace

      # P20 asset contract: canvas, door box, canopy split, manifest pins, prior slices.
      - name: Verify P20 asset contract
        run: gradle :app:testDebugUnitTest --tests "com.example.MapForgeArchitectureContractTest" --stacktrace

      # P21: six authored facilities through the same real draw path, fixed cameras.
      - name: Render P21 premium facilities (real draw code, Robolectric native graphics)
        run: gradle :app:testDebugUnitTest --tests "com.example.MapForgeP21RenderTest" --stacktrace

      # P21 asset + geometry contract: canvas, door-to-trigger mapping, world anchors, fallback.
      - name: Verify P21 asset and geometry contract
        run: gradle :app:testDebugUnitTest --tests "com.example.MapForgeP21ContractTest" --stacktrace

      # P22: Sanctuary + Tower vegetation render matrix + contract verification.
      - name: Render P22 vegetation matrix (real draw code, Robolectric native graphics)
        run: gradle :app:testDebugUnitTest --tests "com.example.MapForgeP22RenderTest" --stacktrace

      - name: Verify P22 vegetation asset and geometry contract
        run: gradle :app:testDebugUnitTest --tests "com.example.MapForgeP22ContractTest" --stacktrace

      # P23: Sanctuary architecture 2.5D repair + environmental props cohesion render matrix.
      - name: Render P23 architecture and props matrix (real draw code, Robolectric native graphics)
        run: gradle :app:testDebugUnitTest --tests "com.example.MapForgeP23RenderTest" --stacktrace

      - name: Verify P23 architecture and props contract
        run: gradle :app:testDebugUnitTest --tests "com.example.MapForgeP23ContractTest" --stacktrace

      # P24: HDR light-response tiers (OFF/REDUCED/BALANCED), day/night/weather, same cameras.
      - name: Render P24 HDR light-response matrix (real draw code, Robolectric native graphics)
        run: gradle :app:testDebugUnitTest --tests "com.example.HdrLightingRenderTest" --stacktrace

      - name: Verify Sanctuary environment art, manifest, layout, and performance regressions
        run: >-
          gradle :app:testDebugUnitTest
          --tests "com.example.SanctuaryMaterialTest.manifestAssetsDecodeAndMatchRuntimeAtlas"
          --tests "com.example.SanctuaryEnvironmentArtTest"
          --tests "com.example.ui.LayoutResponsivenessRobolectricTest"
          --tests "com.example.performance.ScenePerformanceTest"
          --tests "com.example.LivingWorldTest"
          --stacktrace

      # P19: training field / gravel band / cobble joints, fixed cameras for before/after.
      - name: Render terrain slice (real draw code, Robolectric native graphics)
        run: gradle :app:testDebugUnitTest --tests "com.example.MapForgeTerrainRenderTest" --stacktrace

      # The PNGs are also committed so reviewers (and the agent) can open them straight from
      # the branch; the artifact below is the same bytes for offline download.
      - name: Publish render PNGs into the branch
        run: |
          set -euo pipefail
          mkdir -p docs/visual-evidence/p17c/engine-render
          cp -f app/build/visual_screenshots/p17c/*.png docs/visual-evidence/p17c/engine-render/ || true
          mkdir -p docs/visual-evidence/p18/engine-render
          cp -f app/build/visual_screenshots/p18/*.png docs/visual-evidence/p18/engine-render/ || true
          mkdir -p docs/visual-evidence/p19/engine-render
          cp -f app/build/visual_screenshots/p19/*.png docs/visual-evidence/p19/engine-render/ || true
          mkdir -p docs/visual-evidence/p20/engine-render
          cp -f app/build/visual_screenshots/p20/*.png docs/visual-evidence/p20/engine-render/ || true
          mkdir -p docs/visual-evidence/p21/engine-render
          cp -f app/build/visual_screenshots/p21/*.png docs/visual-evidence/p21/engine-render/ || true
          mkdir -p docs/visual-evidence/p22/engine-render
          cp -f app/build/visual_screenshots/p22/*.png docs/visual-evidence/p22/engine-render/ || true
          cp -f app/build/visual_screenshots/p22/camera_props.json docs/visual-evidence/p22/ || true
          if [ ! -d docs/visual-evidence/p23/engine-render-before ]; then
            mkdir -p docs/visual-evidence/p23/engine-render-before
            cp -f app/build/visual_screenshots/p23/*.png docs/visual-evidence/p23/engine-render-before/ || true
          fi
          # P24: keep the merged-P23 frames as this ticket's immutable BEFORE baseline.
          # The checked-out folder still holds P23 bytes here; the AFTER copy below
          # overwrites it with the freshly rendered frames on the current candidate.
          if [ ! -d docs/visual-evidence/p24/engine-render-before ]; then
            mkdir -p docs/visual-evidence/p24/engine-render-before
            cp -f docs/visual-evidence/p23/engine-render/*.png docs/visual-evidence/p24/engine-render-before/ || true
          fi
          mkdir -p docs/visual-evidence/p23/engine-render
          cp -f app/build/visual_screenshots/p23/*.png docs/visual-evidence/p23/engine-render/ || true
          cp -f app/build/visual_screenshots/p23/camera_props.json docs/visual-evidence/p23/ || true
          git config user.name "eternal-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/visual-evidence/p17c/engine-render docs/visual-evidence/p18/engine-render docs/visual-evidence/p19/engine-render docs/visual-evidence/p20/engine-render docs/visual-evidence/p21/engine-render docs/visual-evidence/p22/engine-render docs/visual-evidence/p22/camera_props.json docs/visual-evidence/p23/engine-render-before docs/visual-evidence/p23/engine-render docs/visual-evidence/p23/camera_props.json docs/visual-evidence/p24/engine-render-before
          if git diff --cached --quiet; then echo "no render changes"; exit 0; fi
          git commit -m "P17-C: engine render evidence (automated, Robolectric native graphics)"
          # The branch can move while the render job runs (another commit lands, the agent pushes
          # a fix), so rebase before publishing. A rejected push here used to fail the whole job
          # even though every render and contract test had passed.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.head_ref || github.ref_name }}; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing onto the remote branch"
            git pull --rebase --autostash origin ${{
              github.head_ref || github.ref_name }} || true
          done
          echo "render PNGs are available in the uploaded artifact but could not be pushed"
          exit 0

      # Gradle logs and artifacts live on hosts this repo's reviewers may not reach, so on
      # failure the compiler output is committed back to the branch for triage.
      - name: Capture compiler diagnostics on failure
        if: failure()
        run: |
          set +e
          {
            echo "### :app:compileDebugKotlin"
            gradle :app:compileDebugKotlin --console=plain
            echo "### :app:compileDebugUnitTestKotlin"
            gradle :app:compileDebugUnitTestKotlin --console=plain
          } > /tmp/diag.txt 2>&1
          mkdir -p ci-diagnostics
          tail -c 60000 /tmp/diag.txt > ci-diagnostics/gradle-error.log
          # Unit-test failures never reach the compiler log, so capture the JUnit XML too.
          {
            echo "### test results"
            ls -l app/build/test-results/testDebugUnitTest 2>/dev/null || true
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -e "$f" ] || continue
              head -c 40000 "$f"
            done
          } > ci-diagnostics/render-tests.log 2>&1
          git config user.name "eternal-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci-diagnostics
          git commit -m "ci: gradle diagnostics for the failed render run" || exit 0
          git push origin HEAD:${{ github.head_ref || github.ref_name }} || true

      - name: Show render outputs
        if: always()
        run: |
          ls -l app/build/visual_screenshots/p17c || true
          echo "--- test report ---"
          ls -l app/build/reports/tests/testDebugUnitTest 2>/dev/null || true

      - name: Upload engine render PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-render-evidence
          path: |
            app/build/visual_screenshots/p17c/*.png
            app/build/visual_screenshots/p18/*.png
            app/build/visual_screenshots/p19/*.png
            app/build/visual_screenshots/p20/*.png
            app/build/visual_screenshots/p21/*.png
            app/build/visual_screenshots/p22/*.png
            app/build/visual_screenshots/p22/camera_props.json
            app/build/visual_screenshots/p23/*.png
            app/build/visual_screenshots/p23/camera_props.json
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 30
