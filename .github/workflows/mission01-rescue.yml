name: Floor 1 rescue acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Use the runner's command-line tools, as in the APK workflow. The setup
      # action's default legacy 'tools' package is no longer published.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" --install \
            'platforms;android-36.1' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Add temporary Google Sign-In resource
        run: |
          mkdir -p app/src/debug/res/values
          cat > app/src/debug/res/values/google_services_placeholder.xml <<'EOF'
          <resources>
              <string name="default_web_client_id" translatable="false">debug-placeholder.apps.googleusercontent.com</string>
          </resources>
          EOF
      - name: Create development signing key
        run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Assets, APK and rescue acceptance
        run: |
          python3 tools/validate_assets.py
          gradle :app:assembleDebug :app:testDebugUnitTest --console=plain \
            --tests 'com.example.LostCourier*' \
            --tests 'com.example.Mission01BPlaythroughTest' \
            --tests 'com.example.HeroAgencyTest' \
            --tests 'com.example.TowerOffFieldMasterTest' \
            --tests 'com.example.ui.HeroAgencyAlertUiTest' \
            --tests 'com.example.RescueJourney*' \
            --tests 'com.example.RescueFieldActionsTest' \
            --tests 'com.example.RescueEnemyTargetingTest' \
            --tests 'com.example.RescueTacticalCommandsTest' \
            --tests 'com.example.CourierChoiceInteractionTest' \
            --tests 'com.example.data.LostCourier*' \
            --tests 'com.example.ui.Rescue*' \
            --tests 'com.example.performance.ScenePerformanceTest' \
            --tests 'com.example.performance.SceneFrameLoopLifecycleRobolectricTest'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor1-rescue-evidence
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/visual_screenshots/
            app/build/outputs/apk/debug/app-debug.apk
